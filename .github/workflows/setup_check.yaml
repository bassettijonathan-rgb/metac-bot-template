name: Setup check

# Read-only: checks that the Metaculus token works, that OpenRouter still
# offers every model named in config.py, and how much model credit is left.
# No model call, no forecast, nothing submitted, no cost.
# Runs by hand, and on pull requests that change the model names or this check.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - config.py
      - check_setup.py
      - .github/workflows/setup_check.yaml

jobs:
  setup_check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      - name: Check setup
        run: uv run python check_setup.py
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
