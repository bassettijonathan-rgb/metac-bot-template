name: Forecast on new AI tournament questions

on:
  workflow_dispatch:
  schedule:
    - cron: "7,27,47 * * * *" # every 20 min, offset off the hour. Questions stay open for 3 hours only.

# Never run two forecast jobs at once
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Safety switch: nothing here runs, on the schedule or by hand, until the
# repository variable TOURNAMENT_ENABLED is set to true (Settings -> Secrets and
# variables -> Actions -> Variables). Set it only after the "Test Bot" workflow
# has passed, so an untested bot never forecasts on scored questions.
jobs:
  forecast_job:
    if: vars.TOURNAMENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run bot
        run: |
          uv run python bot.py --mode tournament
        # Secrets live under Settings -> Secrets and variables -> Actions.
        # BOT_PROFILE is an optional repository *variable* (auto, full, standard, lean, minimal).
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          BOT_PROFILE: ${{ vars.BOT_PROFILE }}
