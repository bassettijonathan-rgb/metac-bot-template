name: Test Bot

on:
  workflow_dispatch:
    inputs:
      check_only:
        description: "Only check the setup (Metaculus token, model names). No model calls, no forecasts, no cost"
        type: boolean
        default: false
      dry_run:
        description: "Research and forecast but do not submit to Metaculus"
        type: boolean
        default: false
      limit:
        description: "Forecast at most this many test questions (leave empty for all of them)"
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Manual smoke test on the unscored bot-testing-area tournament.
jobs:
  forecast_job:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      - name: Unit tests
        run: uv run python -m unittest discover -s tests
      - name: Tests against the real library (model calls replaced, nothing submitted)
        run: uv run python -m unittest discover -s tests_real_library
      - name: Check setup (read-only, no model calls)
        run: uv run python check_setup.py ${{ !inputs.check_only && '--require-llm-key' || '' }}
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Run bot
        if: ${{ !inputs.check_only }}
        run: |
          uv run python bot.py --mode test_questions ${{ inputs.dry_run && '--dry-run' || '' }} ${LIMIT:+--limit "$LIMIT"}
        env:
          LIMIT: ${{ inputs.limit }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          BOT_PROFILE: ${{ vars.BOT_PROFILE }}
