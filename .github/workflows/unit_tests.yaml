name: Unit tests

on:
  push:
    branches: [main]
  pull_request:

# No keys, no network calls to Metaculus or to models, nothing submitted.
jobs:
  unit_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests (standard library plus requests)
        run: |
          pip install requests
          python -m unittest discover -s tests

  real_library:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run the bot end to end against the real library (model calls replaced)
        run: uv run python -m unittest discover -s tests_real_library
